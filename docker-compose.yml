version: '3.8'

services:
#  KeyCloak Docker Compose Config
  keycloak:
    image: aniruddhadev/key-clock-spi-service:latest  # <-- built with Jib including SPI JAR
    pull_policy: always #This will fetch the latest image every time without cache issue in docker
    platform: linux/amd64
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql-e6196a5-aniruddhamukherjee232-bf03.a.aivencloud.com:22667/keyclock?verifyServerCertificate=false&useSSL=true&requireSSL=true
      KC_DB_USERNAME: avnadmin
      KC_DB_PASSWORD: AVNS_F2PWGC2rm-SVNNr8RiC
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      KC_EVENTS_LISTENERS: jboss-logging,EXTERNAL_DB_SYNC
      KC_EVENTS_ENABLED: "true"
      KC_SPI_EVENTS_LISTENER_EXTERNAL_DB_SYNC_ENABLED: "true"
#      KEYCLOAK_EXTRA_ARGS: -Dkeycloak.spi.eventListener.providers=EXTERNAL_DB_SYNC
    ports:
      - "8181:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - keycloak_logs:/opt/keycloak/logs
#      - ./key-clock-spi-service/target/key-clock-spi-service.jar:/opt/keycloak/providers/key-clock-spi-service.jar
    profiles:
      - dev
      - prod

    networks:
      - backend

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - backend
    profiles:
      - dev
      - prod

#  zookeeper:
#    image: bitnami/zookeeper
#    pull_policy: always
#    container_name: zookeeper
#    ports:
#      - "2181:2181"
#    environment:
#      ALLOW_ANONYMOUS_LOGIN: yes
#    depends_on:
#      - keycloak
#      - zipkin
#    networks:
#      - backend
#    profiles:
#      - dev
#      - prod

  kafka:
    image: bitnami/kafka
    pull_policy: always
    container_name: kafka-dev
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_KRAFT_CLUSTER_ID=kraft-cluster-1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CFG_MESSAGE_MAX_BYTES=200000000
      - KAFKA_CFG_REPLICA_FETCH_MAX_BYTES=200000000

    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - backend
    profiles:
      - dev
    restart: unless-stopped

  kafka-prod:
    image: bitnami/kafka
    pull_policy: always
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_KRAFT_CLUSTER_ID=kraft-cluster-1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_MESSAGE_MAX_BYTES=200000000
      - KAFKA_CFG_REPLICA_FETCH_MAX_BYTES=200000000

    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - backend
    profiles:
      - prod
    restart: unless-stopped

#  kafka-ui:
#    image: provectuslabs/kafka-ui:latest
#    pull_policy: always
#    container_name: kafka-ui
#    ports:
#      - "9000:9000"
#    environment:
#      - KAFKA_CLUSTERS_0_NAME=local
#      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
#    depends_on:
#      - kafka
#    networks:
#      - backend
#    profiles:
#      - dev
#      - prod

  # Eureka Server (Optional)
  discovery-service:
    image: aniruddhadev/service-discovery:latest
    pull_policy: always #This will fetch the latest image every time without cache issue in docker
    container_name: discovery-service
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - backend
    depends_on:
      - zipkin
      - keycloak
    profiles:
      - prod

  api-gateway:
    image: aniruddhadev/api-gateway:latest
    pull_policy: always #This will fetch the latest image every time without cache issue in docker
    container_name: api-gateway
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - backend
    depends_on:
      - zipkin
      - discovery-service
      - keycloak
    restart: unless-stopped
    profiles:
      - prod

  user-service:
    image: aniruddhadev/user-service:latest
    pull_policy: always
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - backend
    depends_on:
      - api-gateway
      - keycloak
      - discovery-service
    restart: unless-stopped
    profiles:
      - prod

  habit-service :
    image: aniruddhadev/habitservice:latest
    pull_policy: always
    container_name: habit-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - backend
    depends_on:
      - api-gateway
      - keycloak
      - discovery-service
    restart: unless-stopped
    profiles:
      - prod

  scheduler-service:
    image: aniruddhadev/scheduler-service:latest
    pull_policy: always
    container_name: scheduler-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - backend
    depends_on:
      - api-gateway
      - keycloak
      - discovery-service
    restart: unless-stopped
    profiles:
      - prod

volumes:
  keycloak_data:
  keycloak_logs:
  kafka_data:
    driver: local

networks:
  backend:
    driver: bridge