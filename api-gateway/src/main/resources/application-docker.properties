server.port=8083
management.zipkin.tracing.endpoint=http://zipkin:9411
eureka.client.serviceUrl.defaultZone=http://discovery-service:8761/eureka
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8181/realms/habit-tracker-mircoservices-realm
app.eureka-server=discovery-service

## Enable tracing
#management.tracing.enabled=true
#
## Set the sampling probability (1.0 = 100%)
#management.tracing.sampling.probability=1.0
#
## Send traces to Zipkin
#management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
#management.zipkin.tracing.enabled=true