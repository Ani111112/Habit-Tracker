spring.application.name=api-gateway
server.port=8083
#management.zipkin.tracing.endpoint=http://zipkin:9411
eureka.client.serviceUrl.defaultZone=http://discovery-service:8761/eureka
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8181/realms/habit-tracker-mircoservices-realm
app.eureka-server=discovery-service


logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=INFO


#Habit Service Routes
spring.cloud.gateway.routes[0].id=habit-service
spring.cloud.gateway.routes[0].uri=lb://habit-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/user/habit/**

#Habit Service Routes
spring.cloud.gateway.routes[1].id=habit-service-1
spring.cloud.gateway.routes[1].uri=lb://habit-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/habit/v1.0/**

#User Service Routes
spring.cloud.gateway.routes[2].id=User-Service
spring.cloud.gateway.routes[2].uri=lb://User-Service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/user/**

#Discovery Client Routes
spring.cloud.gateway.routes[3].id=discovery-service
spring.cloud.gateway.routes[3].uri=http://${app.eureka-server}:8761
spring.cloud.gateway.routes[3].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[3].filters[0]=SetPath=/

#Discovery Service Static Resources Routes
spring.cloud.gateway.routes[4].id=discovery-service-static
spring.cloud.gateway.routes[4].uri=http://${app.eureka-server}:8761
spring.cloud.gateway.routes[4].predicates[0]=Path=/eureka/**



# Enable tracing
management.tracing.enabled=true

# Set the sampling probability (1.0 = 100%)
management.tracing.sampling.probability=1.0

# Send traces to Zipkin
management.zipkin.tracing.endpoint=http://zipkin:9411/api/v2/spans
management.zipkin.tracing.enabled=true